<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка форматов · Авито</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202522;color:white;font:16px system-ui}nav{height:64px;display:flex;align-items:center;justify-content:center;gap:12px}button{font:inherit;padding:10px 18px;border:0;border-radius:10px;cursor:pointer}button[aria-pressed=true]{background:#c9ffbf}#preview{position:absolute;inset:64px 0 0;overflow:clip}iframe{position:absolute;left:50%;top:50%;border:0;transform-origin:0 0}
</style>
<nav aria-label="Размер экрана"><button data-w="1920" data-h="1080" aria-pressed="true">16:9 · 1920×1080</button><button data-w="1440" data-h="900" aria-pressed="false">Mac · 1440×900</button><button data-w="2048" data-h="1029" aria-pressed="false">Mac · 2048×1029</button></nav>
<div id="preview"><iframe title="Игра в выбранном формате" src="../"></iframe></div>
<script>
const frame=document.querySelector('iframe'), preview=document.querySelector('#preview');let width=1920,height=1080;
function fit(){const s=Math.min(preview.clientWidth/width,preview.clientHeight/height);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform=`translate(${-width*s/2}px,${-height*s/2}px) scale(${s})`;}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;width=+b.dataset.w;height=+b.dataset.h;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));fit();});addEventListener('resize',fit);fit();
</script></html>
